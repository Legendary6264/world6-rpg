# One API instance. Data persists in external PostgreSQL, not the Render filesystem.
services:
  - type: web
    name: world6-api
    runtime: node
    buildCommand: npm ci --include=dev && npm run server:build
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: AUTH_MODE
        value: supabase
      - key: CLIENT_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: OWNER_USER_ID
        sync: false
